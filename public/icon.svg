<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Gradient for the C letter -->
    <linearGradient id="cGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ec4899"/>
      <stop offset="50%" style="stop-color:#f472b6"/>
      <stop offset="100%" style="stop-color:#fb7185"/>
    </linearGradient>

    <!-- Outer glow effect -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feFlood flood-color="#ec4899" flood-opacity="0.6"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Subtle shadow -->
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="20" flood-color="#ec4899" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Black background rounded square -->
  <rect x="0" y="0" width="512" height="512" rx="100" ry="100" fill="#000000"/>

  <!-- C letter with gradient and glow -->
  <g filter="url(#shadow)">
    <g filter="url(#glow)">
      <text
        x="256"
        y="380"
        font-family="Arial Black, Arial, sans-serif"
        font-size="380"
        font-weight="900"
        fill="url(#cGrad)"
        text-anchor="middle"
      >C</text>
    </g>
  </g>
</svg>
