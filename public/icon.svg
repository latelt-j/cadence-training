<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="50%" style="stop-color:#16213e"/>
      <stop offset="100%" style="stop-color:#0f0f23"/>
    </linearGradient>

    <!-- Pink accent gradient -->
    <linearGradient id="pinkGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ec4899"/>
      <stop offset="50%" style="stop-color:#f472b6"/>
      <stop offset="100%" style="stop-color:#fb7185"/>
    </linearGradient>

    <!-- Glow effect -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#ec4899" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect x="0" y="0" width="512" height="512" rx="100" ry="100" fill="url(#bgGrad)"/>

  <!-- Decorative circles in background -->
  <circle cx="256" cy="256" r="220" stroke="url(#pinkGrad)" stroke-width="1" fill="none" opacity="0.1"/>
  <circle cx="256" cy="256" r="180" stroke="url(#pinkGrad)" stroke-width="1" fill="none" opacity="0.08"/>

  <!-- Target circles with glow -->
  <g filter="url(#glow)">
    <!-- Outer ring -->
    <circle cx="256" cy="256" r="160" stroke="url(#pinkGrad)" stroke-width="20" fill="none" opacity="0.4"/>

    <!-- Middle ring -->
    <circle cx="256" cy="256" r="110" stroke="url(#pinkGrad)" stroke-width="20" fill="none" opacity="0.6"/>

    <!-- Inner ring -->
    <circle cx="256" cy="256" r="60" stroke="url(#pinkGrad)" stroke-width="20" fill="none" opacity="0.8"/>

    <!-- Bullseye center -->
    <circle cx="256" cy="256" r="25" fill="url(#pinkGrad)"/>
  </g>

  <!-- Arrow hitting target -->
  <g filter="url(#shadow)">
    <!-- Arrow shaft -->
    <line x1="380" y1="130" x2="280" y2="230" stroke="white" stroke-width="8" stroke-linecap="round"/>

    <!-- Arrow head -->
    <polygon points="256,256 290,235 275,250" fill="white"/>

    <!-- Arrow feathers -->
    <line x1="380" y1="130" x2="400" y2="115" stroke="white" stroke-width="4" stroke-linecap="round"/>
    <line x1="380" y1="130" x2="395" y2="145" stroke="white" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Sparkle effects -->
  <g fill="white" opacity="0.8">
    <circle cx="256" cy="256" r="4"/>
    <circle cx="420" cy="100" r="3"/>
    <circle cx="90" cy="400" r="2"/>
    <circle cx="400" cy="380" r="2"/>
  </g>
</svg>
